name: Android APK QA

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-apk-shell
    paths:
      - 'src/RegNeps.Mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET MAUI Android workload
        shell: pwsh
        run: dotnet workload install maui-android

      - name: Restore Android project
        shell: pwsh
        run: dotnet restore src/RegNeps.Mobile/RegNeps.Mobile.csproj

      - name: Build installable QA APK
        shell: pwsh
        run: dotnet build src/RegNeps.Mobile/RegNeps.Mobile.csproj -f net8.0-android -c Debug -p:AndroidPackageFormat=apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RegNeps-Android-QA
          path: src/RegNeps.Mobile/bin/Debug/net8.0-android/**/*.apk
          if-no-files-found: error
          retention-days: 14
